<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MegaMovie — Search Streaming Sites</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --lilac: #c4b0ff;
    --lilac-btn: #9b7fe8;
    --lilac-dim: rgba(196,176,255,0.15);
    --lilac-glow: rgba(196,176,255,0.35);
    --glass-bg: rgba(255,255,255,0.04);
    --glass-border: 1px solid rgba(180,160,255,0.15);
    --glass-border-hover: 1px solid rgba(196,176,255,0.35);
    --glass-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08), inset 0 -1px 0 rgba(0,0,0,0.3);
    --text-primary: #e8e4f4;
    --text-secondary: #8a85a0;
    --radius-card: 20px;
    --radius-btn: 12px;
    --radius-input: 14px;
  }

  html, body {
    min-height: 100vh;
    background: #07070f;
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
  }

  /* Blobs */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
  }
  .blob-1 { width: 600px; height: 600px; background: #1a0a3a; top: -150px; left: -200px; opacity: 0.8; }
  .blob-2 { width: 500px; height: 500px; background: #0d0d2b; bottom: 10%; right: -150px; opacity: 0.7; }
  .blob-3 { width: 400px; height: 400px; background: #120820; top: 40%; left: 30%; opacity: 0.5; }

  /* Grain overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 200px 200px;
  }

  /* Layout */
  .page {
    position: relative;
    z-index: 2;
    max-width: 860px;
    margin: 0 auto;
    padding: 64px 24px 48px;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeUp 0.6s ease both;
  }

  .logo {
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: clamp(2.8rem, 7vw, 4.5rem);
    letter-spacing: -1px;
    background: linear-gradient(135deg, #e8e4f4 30%, #c4b0ff 70%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    filter: drop-shadow(0 0 40px rgba(196,176,255,0.45));
    line-height: 1.1;
  }

  .logo span {
    -webkit-text-fill-color: #c4b0ff;
  }

  .subtitle {
    margin-top: 10px;
    font-size: 0.95rem;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
  }

  /* Search box */
  .search-wrap {
    background: var(--glass-bg);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: var(--glass-border);
    border-radius: var(--radius-card);
    box-shadow: var(--glass-shadow);
    padding: 20px 20px;
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 40px;
    animation: fadeUp 0.7s ease both;
  }

  #movieInput {
    flex: 1;
    height: 52px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(180,160,255,0.18);
    border-radius: var(--radius-input);
    padding: 0 18px;
    font-size: 1rem;
    font-family: 'Inter', sans-serif;
    color: var(--text-primary);
    outline: none;
    transition: box-shadow 0.25s, border-color 0.25s;
  }
  #movieInput::placeholder { color: var(--text-secondary); }
  #movieInput:focus {
    border-color: rgba(196,176,255,0.5);
    box-shadow: 0 0 0 3px rgba(196,176,255,0.18);
  }

  .search-btn {
    position: relative;
    overflow: hidden;
    height: 52px;
    padding: 0 28px;
    background: var(--lilac-btn);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    border: none;
    border-radius: var(--radius-btn);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.25s, transform 0.15s;
    flex-shrink: 0;
  }
  .search-btn::after {
    content: '';
    position: absolute;
    top: 0; left: -75%;
    width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    transform: skewX(-20deg);
    transition: left 0.45s ease;
  }
  .search-btn:hover::after { left: 130%; }
  .search-btn:hover { background: #b094f5; }
  .search-btn:active { transform: scale(0.97); }

  /* Results grid */
  #results {
    display: none;
  }
  #results.visible {
    display: block;
    animation: fadeUp 0.3s ease both;
  }

  .results-label {
    font-family: 'Outfit', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-bottom: 18px;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }

  @media (max-width: 600px) {
    .search-wrap { flex-direction: column; }
    .search-btn { width: 100%; }
    .cards-grid { grid-template-columns: 1fr; }
    #movieInput { width: 100%; }
  }

  /* Cards */
  .site-card {
    background: var(--glass-bg);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: var(--glass-border);
    border-radius: var(--radius-card);
    box-shadow: var(--glass-shadow);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: border 0.3s cubic-bezier(0.4,0,0.2,1), box-shadow 0.3s cubic-bezier(0.4,0,0.2,1), transform 0.3s cubic-bezier(0.4,0,0.2,1);
    opacity: 0;
    animation: fadeSlideUp 0.4s ease forwards;
  }
  .site-card:hover {
    border: var(--glass-border-hover);
    box-shadow: var(--glass-shadow), 0 0 28px rgba(196,176,255,0.12);
    transform: translateY(-2px);
  }
  .site-card:hover .favicon-wrap { transform: scale(1.08); }

  /* Card top row */
  .card-top {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .favicon-wrap {
    width: 38px; height: 38px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(180,160,255,0.18);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: transform 0.3s ease;
  }
  .favicon-wrap img { width: 20px; height: 20px; border-radius: 3px; }

  .card-title {
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    color: var(--text-primary);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .lang-badge {
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    flex-shrink: 0;
    font-family: 'Inter', sans-serif;
  }
  .badge-en {
    background: rgba(120,120,140,0.3);
    color: #b0aec0;
    border: 1px solid rgba(120,120,140,0.4);
  }
  .badge-de {
    background: rgba(160,130,255,0.18);
    color: #c4b0ff;
    border: 1px solid rgba(180,160,255,0.35);
  }

  /* URL row */
  .url-row {
    font-family: 'Courier New', monospace;
    font-size: 0.72rem;
    color: var(--text-secondary);
    background: rgba(0,0,0,0.25);
    border-radius: 8px;
    padding: 8px 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-decoration: none;
    display: block;
    transition: color 0.2s, background 0.2s;
    border: 1px solid rgba(180,160,255,0.08);
  }
  .url-row:hover { color: var(--lilac); background: rgba(155,127,232,0.1); }

  .manual-note {
    font-size: 0.75rem;
    color: var(--text-secondary);
    font-style: italic;
    padding: 8px 12px;
    background: rgba(0,0,0,0.2);
    border-radius: 8px;
    border: 1px solid rgba(120,120,140,0.2);
  }

  /* Open button */
  .open-btn {
    display: block;
    text-align: center;
    text-decoration: none;
    padding: 11px 16px;
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--lilac);
    background: rgba(155,127,232,0.08);
    border: 1px solid rgba(196,176,255,0.25);
    transition: background 0.25s, color 0.25s, transform 0.15s, border-color 0.25s;
    margin-top: auto;
  }
  .open-btn:hover {
    background: rgba(155,127,232,0.25);
    color: #fff;
    border-color: rgba(196,176,255,0.5);
    transform: translateY(-1px);
  }
  .open-btn:active { transform: translateY(0); }

  /* Footer */
  footer {
    text-align: center;
    margin-top: 56px;
    padding-top: 24px;
    border-top: 1px solid rgba(180,160,255,0.07);
    font-size: 0.78rem;
    color: #4a4760;
    font-family: 'Inter', sans-serif;
    letter-spacing: 0.03em;
  }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="page">
  <header>
    <div class="logo">Mega<span>Movie</span></div>
    <p class="subtitle">Search across streaming sites instantly</p>
  </header>

  <div class="search-wrap">
    <input type="text" id="movieInput" placeholder="Enter movie title…" autocomplete="off" spellcheck="false" />
    <button class="search-btn" id="searchBtn">Search →</button>
  </div>

  <div id="results">
    <p class="results-label" id="resultsLabel"></p>
    <div class="cards-grid" id="cardsGrid"></div>
  </div>

  <footer>MegaMovie — all links open in a new tab &nbsp;·&nbsp; search aggregator only</footer>
</div>

<script>
const SITES = [
  {
    name: '7reels',
    domain: '7reels.cc',
    lang: 'EN',
    buildUrl: q => `https://7reels.cc/search?q=${q}`,
    manual: false
  },
  {
    name: 'Soap2Day',
    domain: 'soap2day.day',
    lang: 'EN',
    buildUrl: q => `https://ww25.soap2day.day/?s=${q}`,
    manual: false
  },
  {
    name: 'HDHub4u',
    domain: 'hdhub4u.glass',
    lang: 'EN',
    buildUrl: q => `https://new1.hdhub4u.limo/search.html?q=${q}`,
    manual: false
  },
  {
    name: '123MoviesFree',
    domain: '123moviesfree.net',
    lang: 'EN',
    buildUrl: q => `https://ww8.123moviesfree.net/search/?q=${q}`,
    manual: false
  },
  {
    name: 'HDToday',
    domain: 'hdtoday.tv',
    lang: 'EN',
    buildUrl: q => `https://hdtodayz.org/search?q=${q}`,
    manual: false
  },
  {
    name: 'MegaKino.lol',
    domain: 'megakino.lol',
    lang: 'DE',
    buildUrl: () => 'https://megakino.lol',
    manual: true
  },
  {
    name: 'MegaKino.org',
    domain: 'megakino.org',
    lang: 'DE',
    buildUrl: q => `https://megakino.org/browse?c=movie&m=filter&keyword=${q}`,
    manual: false
  }
];

function buildCard(site, query, index) {
  const encodedQuery = encodeURIComponent(query);
  const url = site.buildUrl(encodedQuery);
  const faviconUrl = `https://www.google.com/s2/favicons?domain=${site.domain}&sz=32`;
  const langClass = site.lang === 'DE' ? 'badge-de' : 'badge-en';
  const langFlag = site.lang === 'DE' ? '🇩🇪' : '🇬🇧';
  const delay = (index * 0.06).toFixed(2);

  const urlBlock = site.manual
    ? `<div class="manual-note">⚙️ Manual search only — no direct search URL available</div>`
    : `<a class="url-row" href="${url}" target="_blank" rel="noopener noreferrer" title="${url}">${url}</a>`;

  const btnLabel = site.manual ? 'Go to Site →' : 'Open Search →';

  return `
    <div class="site-card" style="animation-delay:${delay}s">
      <div class="card-top">
        <div class="favicon-wrap">
          <img src="${faviconUrl}" alt="${site.name} favicon" loading="lazy" onerror="this.style.display='none'">
        </div>
        <span class="card-title">${site.name}</span>
        <span class="lang-badge ${langClass}">${langFlag} ${site.lang}</span>
      </div>
      ${urlBlock}
      <a class="open-btn" href="${url}" target="_blank" rel="noopener noreferrer">${btnLabel}</a>
    </div>
  `;
}

function runSearch() {
  const query = document.getElementById('movieInput').value.trim();
  if (!query) {
    document.getElementById('movieInput').focus();
    return;
  }

  const resultsDiv = document.getElementById('results');
  const grid = document.getElementById('cardsGrid');
  const label = document.getElementById('resultsLabel');

  grid.innerHTML = SITES.map((site, i) => buildCard(site, query, i)).join('');
  label.textContent = `Results for "${query}"`;
  resultsDiv.classList.add('visible');
  resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.getElementById('searchBtn').addEventListener('click', runSearch);
document.getElementById('movieInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') runSearch();
});
</script>
</body>
</html>
